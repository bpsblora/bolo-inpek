name: BOLO INPEK Development Checks

on:
  push:
    branches: [dev-admin-v2]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax-and-regression:
    name: Frontend syntax & registry regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests
        run: node --test tests/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reject accidental tracked FASIH secrets and raw files
        run: python -m unittest discover -s tests -p check_repo_hygiene.py
